<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Notch</title>
<meta name="description" content="Claude Code session and week limits, shown in a notch at the top of the screen.">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="notch.css">
<script src="notch.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
</svg>

<div class="notch" id="notch">
  <button class="pill" type="button" aria-expanded="false" aria-controls="panel" id="pill">
    <span class="ear ear--left"><span class="ear__muted">Claude usage</span></span><span class="ear ear--right"></span>
  </button>
  <button class="pod" type="button" id="pod" hidden aria-label="Open the session list"></button>
  <div class="panel" id="panel" role="region" aria-label="Claude usage">
   <div class="panel__inner" id="panel-inner">
    <div data-view="usage">
      <p class="notice" id="notice" hidden><button class="link-btn" type="button" id="install">Install Claude Code to see your limits</button></p>
      <p class="notice" id="update" aria-live="polite" hidden><button class="link-btn" type="button" id="update-btn"></button></p>
      <div class="dial" id="dial-wrap" role="img" aria-label="Claude usage">
        <div class="dial__ring" id="dial"></div>
        <div class="dial__mid"><span class="dial__pct" id="dial-pct"></span><span class="dial__sub" id="dial-sub"></span></div>
      </div>
      <div class="lines" id="lines">
        <div class="line" data-line="session"><i class="line__dot is-session"></i><span class="line__name">Session</span><span class="line__pct"></span><span class="line__when"></span></div>
        <div class="line" data-line="week"><i class="line__dot is-week"></i><span class="line__name">Week</span><span class="line__pct"></span><span class="line__when"></span></div>
        <p class="runs" id="runs" hidden></p>
      </div>
      <section class="prayer" id="prayer" aria-labelledby="prayer-title" hidden>
        <h2 class="prayer__title" id="prayer-title"></h2>
        <p class="prayer__off" id="prayer-off" hidden>Prayer times unavailable — will retry</p>
        <div id="prayer-body">
          <p class="prayer__next"><span class="prayer__name" id="prayer-name"></span><span class="prayer__time" id="prayer-time"></span><span class="prayer__in" id="prayer-in"></span></p>
          <div class="prayer__bar" aria-hidden="true"><i id="prayer-bar"></i></div>
          <ol class="prayer__times" id="prayer-times"></ol>
        </div>
      </section>
      <div class="sessions" id="sessions" hidden>
        <h2 class="sessions__title">Sessions</h2>
        <ul class="sessions__list" id="session-list"></ul>
        <p class="sessions__off" id="sessions-off" hidden>Turn on Task alerts to see sessions</p>
      </div>
      <div class="panel__foot"><span id="updated"></span>
        <span class="panel__actions">
          <button class="icon-btn" type="button" aria-label="Settings" id="open-settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></button>
          <button class="icon-btn" type="button" aria-label="Refresh now" id="refresh"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
        </span>
      </div>
    </div>
   </div>
  </div>
</div>
<p class="sr-only" role="status" aria-atomic="true" id="announce"></p>
</body>
</html>
