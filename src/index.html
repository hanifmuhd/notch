<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Notch</title>
<meta name="description" content="Claude Code session and week limits, shown in a notch at the top of the screen.">
<link rel="stylesheet" href="notch.css">
<script src="notch.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
</svg>

<div class="notch" id="notch">
  <button class="pill is-stale" type="button" aria-expanded="false" aria-controls="panel" id="pill">
    <span class="stat__label">Claude usage</span>
  </button>
  <div class="panel" id="panel" role="region" aria-label="Claude usage">
    <div data-view="usage">
      <p class="notice" id="notice" hidden><button class="link-btn" type="button" id="install">Install Claude Code to see your limits</button></p>
      <div class="limit" data-limit="session">
        <div class="limit__head"><span class="limit__name">Session, 5 hours</span><span class="limit__value" data-f="value"></span></div>
        <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Session" data-f="meter"><div class="meter__fill" data-f="fill"></div><div class="meter__pace" data-f="pace"></div></div>
        <div class="limit__foot"><span data-f="reset"></span><span class="pace-key" data-f="pace-text"></span></div>
        <p class="limit__runs" data-f="runs" hidden></p>
      </div>
      <div class="limit" data-limit="week">
        <div class="limit__head"><span class="limit__name">Week, 7 days</span><span class="limit__value" data-f="value"></span></div>
        <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Week" data-f="meter"><div class="meter__fill" data-f="fill"></div><div class="meter__pace" data-f="pace"></div></div>
        <div class="limit__foot"><span data-f="reset"></span><span class="pace-key" data-f="pace-text"></span></div>
        <p class="limit__runs" data-f="runs" hidden></p>
      </div>
      <div class="panel__foot"><span id="updated"></span>
        <span class="panel__actions">
          <button class="icon-btn" type="button" aria-label="Settings" id="open-settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></button>
          <button class="icon-btn" type="button" aria-label="Refresh now" id="refresh"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
        </span>
      </div>
    </div>
    <div data-view="settings" hidden>
      <div class="settings__head">
        <button class="icon-btn" type="button" aria-label="Back to usage" id="close-settings"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
        <span class="settings__title">Settings</span>
      </div>
      <div class="setting setting__row">
        <label for="s-screen">Show on</label>
        <select class="select" id="s-screen"></select>
      </div>
      <div class="setting setting__row">
        <span id="s-position-label">Position</span>
        <span class="segmented" role="radiogroup" aria-labelledby="s-position-label">
          <label><input type="radio" name="position" value="left"><span>Left</span></label>
          <label><input type="radio" name="position" value="centre"><span>Centre</span></label>
          <label><input type="radio" name="position" value="right"><span>Right</span></label>
        </span>
      </div>
      <div class="setting setting__row">
        <label for="s-source">Get usage from</label>
        <select class="select" id="s-source"></select>
      </div>
      <label class="setting check" id="s-start-wsl-row" hidden><input type="checkbox" id="s-start-wsl"><span>Start WSL if it’s stopped</span></label>
      <div class="setting">
        <div class="setting__head"><label for="t-session">Session alert at</label><output class="setting__value" for="t-session" data-out="session">90%</output></div>
        <input class="range" id="t-session" type="range" min="50" max="99" step="1" value="90" data-threshold="session">
      </div>
      <div class="setting">
        <div class="setting__head"><label for="t-week">Week alert at</label><output class="setting__value" for="t-week" data-out="week">90%</output></div>
        <input class="range" id="t-week" type="range" min="50" max="99" step="1" value="90" data-threshold="week">
      </div>
      <p class="setting__hint">Saved as you change it. Full always alerts at 100%.</p>
    </div>
  </div>
</div>
<p class="sr-only" role="status" aria-atomic="true" id="announce"></p>
</body>
</html>
