<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notch logo concepts</title>
<style>
  :root { --bg: #f7f6f3; --ink: #141414; --muted: #5c5c5c; --line: #e2e0db; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: var(--muted); }
  nav { display: flex; gap: 16px; margin: 0 0 20px; }
  a { color: #2a4bd7; }
  a:focus-visible { outline: 2px solid #2a4bd7; outline-offset: 2px; }
  img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
</style>
</head>
<body>
<main>
  <h1>Notch logo concepts</h1>
  <p>Three directions in black and white. Pick one, or say what you like in each.</p>
  <nav><a href="preview.html">Full test sheet: sizes, backgrounds, app icon, browser tab, shelf test</a></nav>
  <img src="concepts.png" alt="Three logo concepts: A, the hanging notch with a ring and countdown; B, two usage rings; C, a lowercase n whose shoulder is a meter arc (recommended). Each shown large and at 64, 32 and 16 pixels.">
</main>
</body>
