<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notch logo concepts</title>
<style>
  :root { --bg: #f7f6f3; --ink: #141414; --muted: #5c5c5c; --line: #e2e0db; --link: #3b46c9; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  h2 { font-size: 19px; margin: 40px 0 4px; }
  p { margin: 0 0 12px; color: var(--muted); }
  a { color: var(--link); }
  a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
</style>
</head>
<body>
<main>
  <h1>Notch logo concepts</h1>
  <p>Pick a direction, or say what you like in each.</p>

  <h2>Round 2: modern, a little cartoon</h2>
  <p>Notch buddy, Peek and Little n. <a href="concepts-v2/preview.html">Full test sheet: sizes, backgrounds, app icon, browser tab, shelf test</a></p>
  <img src="concepts-v2/concepts.png" alt="Round 2 concepts: Notch buddy, a black notch with two big eyes and a blue countdown bar (recommended); Peek, a blue character holding the top edge of the screen; Little n, a chunky blue n with an eye on its shoulder.">

  <h2>Round 1: geometric</h2>
  <p>Hanging notch, Usage rings and n for notch. <a href="concepts/preview.html">Full test sheet</a></p>
  <img src="concepts/concepts.png" alt="Round 1 concepts in black: the hanging notch, two usage rings, and a geometric n with a meter arc.">
</main>
</body>
</html>
